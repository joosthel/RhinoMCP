name: Feedback / works for me
description: Tell us what worked, what you built, or what's missing. Reports like "it works on Windows" are valuable too.
labels: [feedback]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["macOS (Apple Silicon)", "macOS (Intel)", "Windows 10", "Windows 11", "Other"]
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: What worked, what didn't, what you'd like next. Screenshots welcome.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Optional logs
      description: scripts/collect_logs.sh (Mac) or scripts\windows\collect_logs.ps1 (Windows).
